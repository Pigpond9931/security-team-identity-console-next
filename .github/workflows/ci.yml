name: SECURITY TEAM Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.lock.txt
      - name: Instalar y compilar React
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Regresiones en bases temporales
        run: python tests/run_regression.py
