name: SECURITY TEAM Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: npm
      - name: Verificar las fuentes entregadas
        run: python tools/source_manifest.py
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.lock.txt
      - name: Instalar y compilar React
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Regresiones en bases temporales
        run: python tests/run_regression.py
      - name: Comprobaciones de direcciones de cámara
        run: node tests/test_camera_url.cjs
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev
      - name: Instalar navegador de prueba
        run: npx playwright install chromium
      - name: Recorrido real con cámara sintética y accesibilidad
        env:
          ST_TEST_BROWSER_CHANNEL: chromium
        run: python tests/browser_next.py
